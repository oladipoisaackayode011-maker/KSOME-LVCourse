<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reset Password – KSOME Media Academy</title>
  <meta name="description" content="Reset your KSOME Media Academy password.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1736">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">KSOME</div>
    <h2>Forgot Password?</h2>
    <p class="sub">Enter the email you registered with and we'll send you a link to reset your password.</p>

    <form id="resetForm" novalidate>
      <p id="msg" class="auth-msg" role="status" aria-live="polite"></p>

      <div class="form-group">
        <label for="resetEmail">Email Address</label>
        <input type="email" id="resetEmail" placeholder="Enter your email" autocomplete="email" inputmode="email" required>
      </div>

      <button type="submit" id="resetBtn" class="btn-primary btn-block" style="margin-top:0.5rem;">Send Reset Link</button>
    </form>

    <div class="auth-link" style="margin-top:1.25rem;">
      Remembered it? <a href="login.html">Back to Login</a>
    </div>
    <div class="auth-link" style="margin-top:0.5rem;">
      <a href="index.html" class="auth-muted">← Back to Home</a>
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC1LV-g2H3yKs_6nbruF1TEbCoV34UX0jI",
    authDomain: "ksome-website.firebaseapp.com",
    projectId: "ksome-website",
    storageBucket: "ksome-website.appspot.com",
    messagingSenderId: "970299265208",
    appId: "1:970299265208:web:870e4de77e51e9032e644d"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form  = document.getElementById("resetForm");
  const input = document.getElementById("resetEmail");
  const msg   = document.getElementById("msg");
  const btn   = document.getElementById("resetBtn");
  const COOLDOWN = 60; // seconds before another email can be requested

  // Pre-fill the email if the login page passed it along (?email=...)
  const prefill = new URLSearchParams(location.search).get("email");
  if (prefill) input.value = prefill;

  function show(type, text) {
    msg.className = "auth-msg msg-" + type;
    msg.textContent = text;
  }

  function startCooldown() {
    let left = COOLDOWN;
    btn.disabled = true;
    const tick = () => {
      if (left <= 0) {
        btn.disabled = false;
        btn.textContent = "Send Reset Link Again";
        return;
      }
      btn.textContent = "Resend available in " + left + "s";
      left--;
      setTimeout(tick, 1000);
    };
    tick();
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const email = input.value.trim();

    if (!email) { show("error", "❌ Please enter your email address."); return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { show("error", "❌ Please enter a valid email address."); return; }

    btn.disabled = true;
    btn.textContent = "Sending...";
    show("pending", "⏳ Sending reset link...");

    try {
      await sendPasswordResetEmail(auth, email);
      // Same wording whether or not the account exists, so nobody can probe which emails are registered.
      show("success", "✅ If an account exists for " + email + ", a reset link is on its way. Check your inbox and your spam folder.");
      startCooldown();
    } catch (error) {
      console.error("Password reset error:", error);
      btn.disabled = false;
      btn.textContent = "Send Reset Link";

      switch (error.code) {
        case "auth/invalid-email":
          show("error", "❌ That email address doesn't look right.");
          break;
        case "auth/user-not-found":
          // Only reached if the project has email-enumeration protection off.
          show("success", "✅ If an account exists for " + email + ", a reset link is on its way. Check your inbox and your spam folder.");
          startCooldown();
          break;
        case "auth/too-many-requests":
          show("error", "❌ Too many attempts. Please wait a few minutes and try again.");
          break;
        case "auth/network-request-failed":
          show("error", "❌ No internet connection. Please try again.");
          break;
        case "auth/operation-not-allowed":
          show("error", "❌ Password reset isn't enabled yet. Please contact KSOME support.");
          break;
        default:
          show("error", "❌ Something went wrong (" + (error.code || "unknown") + "). Please try again.");
      }
    }
  });
</script>

</body>
</html>
